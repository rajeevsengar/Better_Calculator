<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Days to Date Calculator</title>
    <meta name="description" content="Add or subtract days from any date. Calculate future or past dates easily with our free online date calculator.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="../../../assets/images/favicon.png" />
    
    <!-- Scripts -->
    <script src="../../../helpers/script.js"></script>
    <script src="../../../helpers/script-loader.js"></script>
    <script>
      // Initialize page with centralized CSS and script loading
      document.addEventListener('DOMContentLoaded', function() {
        // Apply data-theme first to prevent flash
        setTimeout(() => {
          if (document.body) {
            document.body.setAttribute('data-theme-applied', 'true');
          }
        }, 50);
        
        // Load CSS first
        window.loadCSSForPage('calculator', 'dateCalculatorAddDays');
        
        // Then load scripts and initialize
        window.loadScriptsForPage('calculator', 'dateCalculatorAddDays').then(() => {
          // Initialize calculator after all scripts are loaded
          if (window.DateCalculator && window.DateCalculator.initializeDateCalculator) {
            window.DateCalculator.initializeDateCalculator();
          } else {
            console.error("Date Calculator not found or initializeDateCalculator not available");
          }
        }).catch(error => {
          console.error('Failed to load scripts:', error);
        });
      });
      
      // Hide spinner after all resources are loaded
      window.addEventListener('load', function() {
        const loader = document.querySelector('#initial-loader');
        const app = document.querySelector('#app');
        if (loader && app) {
          loader.style.display = 'none';
          app.style.display = 'block';
        }
      });
    </script>

</head>
<body>
    <div id="initial-loader">
      <div class="spinner"></div>
    </div>
    <div id="app" style="display:none;">
      <div class="page-container">
        <!-- Site Header Component -->
        <site-header></site-header>
        <menu-header></menu-header>

        <main>
          <!-- Main Content Wrapper -->
          <div class="main-content-wrapper">
            <!-- Left Grid: Calculator Content -->
            <div class="left-grid">
              <div class="calculator-content">
                <div class="calculator-main-section">
                  <!-- Calculator Tabs -->
                  <calculator-tabs 
                    tab-config='[
                      {"name": "Count Days", "url": "../duration/", "key": "duration"},
                      {"name": "Add Days", "url": "../add-days/", "key": "add-days"}
                    ]'
                    default-tab="duration">
                  </calculator-tabs>

                  <!-- Date Calculator Section -->
                  <section id="date" class="active-section">
                    <!-- Enhanced Mode Toggle -->
                    <div class="enhanced-toggle" style="cursor: pointer;" id="toggle-slider-add-days">
                        <div class="toggle-container">
                            <label class="toggle-label">Show Time Inputs</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="addDaysEnhancedToggle" />
                                <span class="toggle-slider"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Date Arithmetic -->
                    <div class="card" style="display: grid; grid-template-columns: 100%; align-items: stretch;">
                        <!-- Date Input -->
                        <label>Date Arithmetic</label>
                        <date-input id="baseDate" label="Base Date" size="full" show-label show-quick-links default="now"></date-input>
                        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
                            <label for="baseTime" style="display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-secondary, #475569); font-weight: 500;">Base Time</label>
                            <time-input id="baseTime" size="full" show-quick-links default="now" style="display: none;"></time-input>
                            <label for="baseTimezone" style="display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-secondary, #475569); font-weight: 500;">Base Timezone</label>
                            <timezone-input id="baseTimezone" size="full" default="now" style="display: none; margin-top: 8px;"></timezone-input>
                        </div>
                    </div>

                    <!-- Date Arithmetic Inputs -->
                    <div class="card" style="margin-top: 16px;">
                        <label id="dateArithmeticLabel" style="display: block; margin-bottom: 12px; font-weight: 500;">Add/Subtract Time</label>
                        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;">
                            <div>
                                <label style="margin-bottom: 12px;" class="input-label" for="deltaDays">Days</label>
                                <input class="input-field" type="number" id="deltaDays" placeholder="Days" />
                            </div>
                            <div>
                                <label style="margin-bottom: 12px;" class="input-label" for="deltaWeeks">Weeks</label>
                                <input class="input-field" type="number" id="deltaWeeks" placeholder="Weeks" />
                            </div>
                            <div>
                                <label style="margin-bottom: 12px;" class="input-label" for="deltaMonths">Months</label>
                                <input class="input-field" type="number" id="deltaMonths" placeholder="Months" />
                            </div>
                            <div>
                                <label style="margin-bottom: 12px;" class="input-label" for="deltaYears">Years</label>
                                <input class="input-field" type="number" id="deltaYears" placeholder="Years" />
                            </div>
                        </div>
                    </div>

                    <!-- Time Arithmetic Inputs (Hidden by default) -->
                    <div id="timeArithmeticCard" class="card" style="margin-top: 16px; display: none;">
                        <label id="timeArithmeticLabel" style="display: block; margin-bottom: 12px; font-weight: 500;">Add/Subtract Time</label>
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
                            <div>
                                <label style="margin-bottom: 12px;" class="input-label" for="deltaHours">Hours</label>
                                <input class="input-field" type="number" id="deltaHours" placeholder="Hours" />
                            </div>
                            <div>
                                <label style="margin-bottom: 12px;" class="input-label" for="deltaMinutes">Minutes</label>
                                <input class="input-field" type="number" id="deltaMinutes" placeholder="Minutes" />
                            </div>
                            <div>
                                <label style="margin-bottom: 12px;" class="input-label" for="deltaSeconds">Seconds</label>
                                <input class="input-field" type="number" id="deltaSeconds" placeholder="Seconds" />
                            </div>
                        </div>
                    </div>

                    <!-- Operation -->
                    <div class="card" style="margin-top: 16px; width: 50%;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Operation</label>
                        <div id="deltaSignChips" style="display: grid; grid-template-columns: 20% 20%; gap: 12px;">
                            <button class="chip selected" data-value="add">Add</button>
                            <button class="chip" data-value="subtract">Subtract</button>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="card" style="margin-top: 16px;">
                        <div style="display: flex; gap: 8px;">
                            <button class="button-primary" onclick="addSubtractDays()">
                                Apply
                            </button>
                            <button onclick="clearAddDays()">
                                Clear
                            </button>
                        </div>
                    </div>

                    <!-- Result Section -->
                    <div id="dateResultContainer1" style="display: none; margin-top: 16px;">
                        <div id="dateMathRes" class="muted card result-box"></div>
                    </div>
                  </section>
                </div>
              </div>
            </div>
              
            <!-- Right Grid: Ad Space -->
            <div class="right-grid">
              <div class="ad-space">
                Ad Space<br><br><br><br><br><br>Ad Space<br><br><br><br><br><br>Ad Space
              </div>
            </div>
          </div>
              
              <!-- Additional Content Wrapper (for calculator description, etc.) -->
              <div class="main-content-wrapper">
                <!-- Left Grid: Calculator Description -->
                <div class="left-grid">
                  <calculator-description calculator="date"></calculator-description>
                </div>
                
                <!-- Right Grid: Additional Ad Space or Content -->
                <div class="right-grid">
                  <div class="ad-space">
                    Additional Ad Space<br><br><br><br><br><br>Ad Space<br><br><br><br><br><br>Ad Space
                  </div>
                </div>
              </div>
            </main>

        <!-- Site Footer Component -->
        <site-footer></site-footer>

    </div>
    
  </body>
</html>
