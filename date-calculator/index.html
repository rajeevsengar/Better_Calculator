<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Date Calculator</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon.png" />
    
    <!-- Critical theme initialization to prevent flash -->
    <script>
      // Wait for DOM and CSS to be ready before showing content
      document.addEventListener('DOMContentLoaded', function() {
        // Small delay to ensure CSS variables are loaded
        setTimeout(() => {
          if (document.body) {
            document.body.setAttribute('data-theme-applied', 'true');
          }
        }, 50);
      });
      
      // Hide spinner after all resources are loaded
      window.addEventListener('load', function() {
        const loader = document.querySelector('#initial-loader');
        const app = document.querySelector('#app');
        if (loader && app) {
          loader.style.display = 'none';
          app.style.display = 'block';
        }
      });
    </script>
    
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/misc.css" />
    <link rel="stylesheet" href="../assets/css/themes.css" />
    <link rel="stylesheet" href="date-calculator.css" />
    <!-- Scripts -->
    <script src="../helpers/script.js"></script>
    <script src="../helpers/constants.js" defer></script>
    <script src="../helpers/text-config.js" defer></script>
    <script src="../helpers/util.js" defer></script>
    <script src="../helpers/timezone-resolver.js" defer></script>
    <!-- Web Components -->
    <script src="../components/site-header/site-header.js" defer></script>
    <script src="../components/menu-header/menu-header.js" defer></script>
    <script src="../components/site-footer/site-footer.js" defer></script>
    <script src="../components/date-input/date-input.js" defer></script>
    <script src="../components/time-input/time-input.js" defer></script>
    <script src="../components/searchable-select/searchable-select.js" defer></script>
    <script type="module" src="../components/timezone-input/timezone-input.js" defer></script>
    <script src="../components/calculator-description/calculator-description.js" defer></script>
    <script src="date-calculator.js" defer></script>

</head>
<body>
    <div id="initial-loader">
      <div class="spinner"></div>
    </div>
    <div id="app" style="display:none;">
      <div class="page-container">
        <!-- Site Header Component -->
        <site-header></site-header>
        <menu-header></menu-header>

        <main>
          <!-- Main Content Wrapper -->
          <div class="main-content-wrapper">
            <!-- Left Grid: Calculator Content -->
            <div class="left-grid">
              <div class="calculator-content">
                <div class="calculator-main-section">
                  <!-- Date Calculator Section -->
                  <section id="date" class="active-section">
                    <div class="date-tabs">
                        <div class="tab-buttons">
                            <button class="tab-button active" data-tab="count-days">Count Days</button>
                            <button class="tab-button" data-tab="add-days">Add Days</button>
                        </div>
                        
                        <!-- Count Days Tab -->
                        <div id="count-days" class="tab-content active">
                            <!-- Enhanced Mode Toggle -->
                            <div id="toggle-slider-enhanced" style="cursor: pointer;" class="enhanced-toggle">
                                <div class="toggle-container">
                                    <label class="toggle-label">Enhanced Mode</label>
                                    <div class="toggle-switch">
                                        <input type="checkbox" id="enhancedToggle" />
                                        <span class="toggle-slider"></span>
                                    </div>
                                </div>
                            </div>
                            <!-- From and To Sections Side by Side -->
                            <div style="display: grid; grid-template-columns: 40% 16% 40%; gap: 16px; margin-bottom: 8px;">
                                <!-- From Section -->
                                <div class="card">
                                    <h4 class="input-label">Start Date</h4>
                                    <date-input id="fromDate" size="full" show-quick-links default="now"></date-input>
                                    <div id="fromTimeInputs" style="display: none; flex-direction: column;">
                                        <h4 class="input-label">From Timezone</h4>
                                        <timezone-input id="fromTimezone" size="full" default="now"></timezone-input>
                                        <h4 class="input-label">From Time</h4>
                                        <time-input id="fromTime" size="full" show-quick-links default="now"></time-input>
                                    </div>
                                </div>
                                <div></div>
                                <!-- To Section -->
                                <div class="card">
                                    <h4 class="input-label">End Date</h4>
                                    <date-input id="toDate" size="full" show-quick-links default="now"></date-input>
                                    <div id="toTimeInputs" style="display: none; flex-direction: column;">
                                      <h4 class="input-label">To Timezone</h4>
                                      <timezone-input id="toTimezone" size="full" default="now"></timezone-input>
                                      <h4 class="input-label">To Time</h4>
                                        <time-input id="toTime" size="full" show-quick-links default="now"></time-input>
                                    </div>
                                </div>
                            </div>
                            <!-- Add 1 day to end date section -->
                            <div id="includeEndDateDiv" class="card">
                                <label style="cursor: pointer; display: grid; grid-template-columns: 5% 80%; gap: 16px; margin-bottom: 8px; margin-top: 32px;">
                                  <input type="checkbox" id="includeEndDate" />
                                    Include end date in calculation (1 day is added)
                                </label>
                            </div>
                            <!-- Compute Difference Button -->
                            <div style="display: flex; gap: 8px; margin-top: 32px; margin-bottom: 16px;">
                                <button class="button-primary" onclick="countDays()">
                                    Compute Difference
                                </button>
                                <button onclick="clearDates()">Clear</button>
                            </div>
                            <!-- Result Section at Bottom -->
                            <div id="dateResultContainer" style="display: none; margin-top: 16px;">
                                <div id="dateResult" class="muted card result-box"></div>
                            </div>
                        </div>
                        <!-- Add Days Tab -->
                        <div id="add-days" class="tab-content">
                            <!-- Enhanced Mode Toggle -->
                            <div class="enhanced-toggle" style="cursor: pointer;" id="toggle-slider-add-days">
                                <div class="toggle-container">
                                    <label class="toggle-label">Show Time Inputs</label>
                                    <div class="toggle-switch">
                                        <input type="checkbox" id="addDaysEnhancedToggle" />
                                        <span class="toggle-slider"></span>
                                    </div>
                                </div>
                            </div>

                            <!-- Date Arithmetic -->
                            <div class="card" style="display: grid; grid-template-columns: 100%; align-items: stretch;">
                                <!-- Date Input -->
                                <label>Date Arithmetic</label>
                                <date-input id="baseDate" label="Base Date" size="full" show-label show-quick-links default="now"></date-input>
                                <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
                                    <label for="baseTime" style="display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-secondary, #475569); font-weight: 500;">Base Time</label>
                                    <time-input id="baseTime" size="full" show-quick-links default="now" style="display: none;"></time-input>
                                    <label for="baseTimezone" style="display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-secondary, #475569); font-weight: 500;">Base Timezone</label>
                                    <timezone-input id="baseTimezone" size="full" default="now" style="display: none; margin-top: 8px;"></timezone-input>
                                </div>
                            </div>

                            <!-- Date Arithmetic Inputs -->
                            <div class="card" style="margin-top: 16px;">
                                <label id="dateArithmeticLabel" style="display: block; margin-bottom: 12px; font-weight: 500;">Add/Subtract Time</label>
                                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;">
                                    <div>
                                        <label style="margin-bottom: 12px;" class="input-label" for="deltaDays">Days</label>
                                        <input class="input-field" type="number" id="deltaDays" placeholder="Days" />
                                    </div>
                                    <div>
                                        <label style="margin-bottom: 12px;" class="input-label" for="deltaWeeks">Weeks</label>
                                        <input class="input-field" type="number" id="deltaWeeks" placeholder="Weeks" />
                                    </div>
                                    <div>
                                        <label style="margin-bottom: 12px;" class="input-label" for="deltaMonths">Months</label>
                                        <input class="input-field" type="number" id="deltaMonths" placeholder="Months" />
                                    </div>
                                    <div>
                                        <label style="margin-bottom: 12px;" class="input-label" for="deltaYears">Years</label>
                                        <input class="input-field" type="number" id="deltaYears" placeholder="Years" />
                                    </div>
                                </div>
                            </div>

                            <!-- Time Arithmetic Inputs (Hidden by default) -->
                            <div id="timeArithmeticCard" class="card" style="margin-top: 16px; display: none;">
                                <label id="timeArithmeticLabel" style="display: block; margin-bottom: 12px; font-weight: 500;">Add/Subtract Time</label>
                                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
                                    <div>
                                        <label style="margin-bottom: 12px;" class="input-label" for="deltaHours">Hours</label>
                                        <input class="input-field" type="number" id="deltaHours" placeholder="Hours" />
                                    </div>
                                    <div>
                                        <label style="margin-bottom: 12px;" class="input-label" for="deltaMinutes">Minutes</label>
                                        <input class="input-field" type="number" id="deltaMinutes" placeholder="Minutes" />
                                    </div>
                                    <div>
                                        <label style="margin-bottom: 12px;" class="input-label" for="deltaSeconds">Seconds</label>
                                        <input class="input-field" type="number" id="deltaSeconds" placeholder="Seconds" />
                                    </div>
                                </div>
                            </div>

                            <!-- Operation -->
                            <div class="card" style="margin-top: 16px; width: 50%;">
                                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Operation</label>
                                <div id="deltaSignChips" style="display: grid; grid-template-columns: 20% 20%; gap: 12px;">
                                    <button class="chip selected" data-value="add">Add</button>
                                    <button class="chip" data-value="subtract">Subtract</button>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="card" style="margin-top: 16px;">
                                <div style="display: flex; gap: 8px;">
                                    <button class="button-primary" onclick="addSubtractDays()">
                                        Apply
                                    </button>
                                    <button onclick="clearAddDays()">
                                        Clear
                                    </button>
                                </div>
                            </div>

                            <!-- Result Section -->
                            <div id="dateResultContainer1" style="display: none; margin-top: 16px;">
                                <div id="dateMathRes" class="muted card result-box"></div>
                            </div>
                        </div>
                    </div>
                  </section>
                </div>
              </div>
            </div>
              
            <!-- Right Grid: Ad Space -->
            <div class="right-grid">
              <div class="ad-space">
                Ad Space<br><br><br><br><br><br>Ad Space<br><br><br><br><br><br>Ad Space
              </div>
            </div>
          </div>
              
              <!-- Additional Content Wrapper (for calculator description, etc.) -->
              <div class="main-content-wrapper">
                <!-- Left Grid: Calculator Description -->
                <div class="left-grid">
                  <calculator-description calculator="date"></calculator-description>
                </div>
                
                <!-- Right Grid: Additional Ad Space or Content -->
                <div class="right-grid">
                  <div class="ad-space">
                    Additional Ad Space<br><br><br><br><br><br>Ad Space<br><br><br><br><br><br>Ad Space
                  </div>
                </div>
              </div>
            </main>

        <!-- Site Footer Component -->
        <site-footer></site-footer>


    </div>
    
    <!-- Initialize Date Calculator -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Wait for web components to be ready
        setTimeout(() => {
          if (window.DateCalculator && window.DateCalculator.initializeDateCalculator) {
            window.DateCalculator.initializeDateCalculator();
            console.log("Date Calculator initialized successfully");
          } else {
            console.error(
              "Date Calculator not found or initializeDateCalculator not available"
            );
          }
        }, 200);
      });
    </script>
  </body>
</html>
