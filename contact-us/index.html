<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Us - ZeroCalculator.net</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon.png" />
    
    <!-- Critical theme initialization to prevent flash -->
    <script>
      // Wait for DOM and CSS to be ready before showing content
      document.addEventListener('DOMContentLoaded', function() {
        // Small delay to ensure CSS variables are loaded
        setTimeout(() => {
          if (document.body) {
            document.body.setAttribute('data-theme-applied', 'true');
          }
        }, 50);
      });
      
      // Hide spinner after all resources are loaded
      window.addEventListener('load', function() {
        const loader = document.querySelector('#initial-loader');
        const app = document.querySelector('#app');
        if (loader && app) {
          loader.style.display = 'none';
          app.style.display = 'block';
        }
      });
    </script>
    
    <!-- Styles-->
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/misc.css" />
    <link rel="stylesheet" href="../assets/css/themes.css" />
    <link rel="stylesheet" href="../components/info-page/info-page.css" />
    <link rel="stylesheet" href="../components/info-sidebar/info-sidebar.css" />
    
    <!-- Scripts -->
    <script src="../helpers/calculator-description.js"></script>
    <script src="../components/site-header/site-header.js" defer></script>
    <script src="../components/menu-header/menu-header.js" defer></script>
    <script src="../components/site-footer/site-footer.js" defer></script>
    <script src="../components/info-page/info-page.js" defer></script>
    <script src="../components/info-sidebar/info-sidebar.js" defer></script>
    <script src="../helpers/script.js" defer></script>
    <script src="../helpers/text-config.js" defer></script>
  </head>

  <body>
    <div id="initial-loader">
      <div class="spinner"></div>
    </div>

    <div id="app" style="display:none;">
      <div class="page-container">
        <!-- Site Header Component -->
        <site-header></site-header>
        <menu-header></menu-header>

        <main>
          <div class="main-content-wrapper">
            <!-- Left Grid: Contact Content -->
            <div class="left-grid">
              <info-page 
                page-title="Contact Us" 
                content-key="contact.content">
              </info-page>
            </div>
            
            <!-- Right Grid: Additional Content -->
            <div class="right-grid">
              <info-sidebar 
                sidebar-title="Support"
                sidebar-links='[{"text":"FAQ","href":"../faq/"},{"text":"Report Bug","href":"mailto:contact@zerocalculator.net"},{"text":"Feature Request","href":"mailto:contact@zerocalculator.net"}]'>
              </info-sidebar>
            </div>
          </div>
        </main>

        <!-- Site Footer Component -->
        <site-footer></site-footer>
      </div>
    </div>
    
  </body>
</html>
