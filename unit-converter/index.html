<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unit Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/themes.css" />
    <link rel="stylesheet" href="../assets/css/misc.css" />
    <link rel="stylesheet" href="../assets/css/mobile.css" />
    <link rel="stylesheet" href="unit-converter.css" />
  </head>
  <body>
    <div class="page-container">
      <!-- Header -->
      <header class="header1">
        <div class="header-inner">
          <img
            src="../assets/images/india-flag.png"
            alt="Calculator Icon - Calculator Icon Transparent"
            alt="Logo"
            class="flag-icon"
          />
          <p
            id="builtWithLove"
            style="color: black; font-family: Helvetica Neue"
          ></p>
        </div>
      </header>

      <!-- Responsive Header - Shows different content based on screen size -->
      <header class="header2 mobile-header">
        <div class="header-inner mobile-header-inner">
          <div class="brand mobile-brand">
            <img
              id="siteLogo"
              src="../assets/images/site_logo.png"
              alt="Calculator Icon - Calculator Icon Transparent"
              alt="Logo"
            />
            <div class="brand-text mobile-brand-text">
              <h1 id="brandName"></h1>
              <div id="tagline" class="muted tagline">
                <div class="tagline-line tagline-first"></div>
                <div class="tagline-line tagline-second"></div>
              </div>
            </div>
          </div>

          <!-- Mobile Menu Toggle - Only visible on mobile -->
          <div class="mobile-menu-toggle" id="mobileMenuToggle">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </header>

      <!-- Mobile Menu Overlay - Only visible on mobile -->
      <div class="mobile-menu-overlay" id="mobileMenuOverlay">
        <div class="mobile-menu-content">
          <div class="mobile-menu-header">
            <h3>Menu</h3>
            <button class="mobile-menu-close" id="mobileMenuClose">×</button>
          </div>

          <!-- Menu Items -->
          <div class="mobile-menu-items">
            <div class="mobile-item active">Unit Converter</div>
          </div>

          <!-- Theme Switcher -->
          <div class="mobile-theme-switcher">
            <div class="theme-label">Theme:</div>
            <div class="theme-options">
              <label class="theme-option" data-theme="default">
                <input type="radio" name="theme" value="default" checked />
                <span class="theme-color" style="background: #2196f3"></span>
              </label>
              <label class="theme-option" data-theme="green">
                <input type="radio" name="theme" value="green" />
                <span class="theme-color" style="background: #4caf50"></span>
              </label>
              <label class="theme-option" data-theme="purple">
                <input type="radio" name="theme" value="purple" />
                <span class="theme-color" style="background: #9c27b0"></span>
              </label>
              <label class="theme-option" data-theme="orange">
                <input type="radio" name="theme" value="orange" />
                <span class="theme-color" style="background: #ff9800"></span>
              </label>
            </div>
          </div>

          <!-- Global ribbons -->
          <div class="ribbons">
            <div class="ribbon" data-type="tips">Tips</div>
            <div class="ribbon" data-type="instructions">Instructions</div>
            <div class="ribbon" data-type="examples">Examples</div>
            <div id="ribbonPopup" class="ribbon-popup" aria-hidden="true"></div>
          </div>
        </div>
      </div>

      <main class="calculator-main-container">
        <!-- Unit Converter -->
        <div class="card unit-types-card">
                <div class="calculator-main-section" style="display: flex; gap: 1.5rem; align-items: stretch;">
                    <!-- Unit Types section - Left side -->
                    <div class="unit-types-section">
                        <div class="title-header">Unit Types</div>
                        <!-- Mobile-friendly combobox -->
                        <select id="mobileUnitTypes" class="mobile-unit-select">
                            <option value="">Select Unit Type</option>
                        </select>
                        <!-- Desktop list view -->
                        <div id="unitTypesList" class="unit-types-list desktop-unit-types-list">
                            <!-- Content will be populated dynamically from text-config.js -->
                        </div>
                    </div>
                    
                    <!-- From-To inputs and swap button - Right side -->
                    <div style="display: flex; flex-direction: column; gap: 1.5rem; flex: 1;">
                        <div style="display: flex; gap: 1.5rem;">
                            <div class="card" style="flex: 1;">
                                <div class="title-header">From</div>
                                <input id="fromValue" placeholder="Enter value" />
                                <div class="unit-chips-container">
                                    <div id="fromUnitButtons" class="unit-buttons"></div>
                                </div>
                            </div>
                            <div class="card" style="flex: 1;">
                                <div class="title-header">To</div>
                                <input id="toValue" placeholder="Result" readonly />
                                <div class="unit-chips-container">
                                    <div id="toUnitButtons" class="unit-buttons"></div>
                                </div>
                            </div>
                        </div>
                         <!-- Swap button below the inputs -->
                        <div class="swap-button-center" style="display: flex; justify-content: center;">
                            <button onclick="swapUnits()" class="swap-button">
                                Swap
                            </button>
                        </div>
                    </div>
                </div>
            </div>
      </main>

      <!-- Footer -->
      <footer class="site-footer">
        <div class="footer-content">
          <div class="footer-main">
            <p class="footer-tagline">
              Not just another calculator website — it covers the missing
              features of others.
            </p>
            <p class="footer-highlight">
              🏆 The most feature-rich
              <span id="emi-link" class="footer-link">EMI Calculator</span>
              on the internet, our proud flagship.
            </p>
          </div>
          <div
            class="footer-easter-egg"
            id="falseEasterEgg"
            style="cursor: pointer"
            title="Click me if you dare..."
          >
            🥚
            <em
              >This site contains a hidden easter egg. Good luck finding it!</em
            >
            🥚
          </div>
        </div>
      </footer>

      <!-- False Easter Egg Popup -->
      <div
        id="falseEasterEggPopup"
        class="false-easter-egg-popup"
        aria-hidden="true"
      >
        <div class="false-facts-header">
          <h3></h3>
          <button class="false-facts-close" onclick="closeFalseEasterEgg()">
            ×
          </button>
        </div>
        <div class="false-facts-content"></div>
      </div>

      <!-- Site Facts Popup -->
      <div id="siteFactsPopup" class="site-facts-popup" aria-hidden="true">
        <div class="facts-header">
          <h3></h3>
          <button class="facts-close" onclick="closeSiteFacts()">×</button>
        </div>
        <div class="facts-content">
          <div class="story-section">
            <!-- Content will be populated dynamically from text-config.js -->
          </div>
        </div>
      </div>
    </div>

    <script src="../helpers/constants.js"></script>
    <script src="../helpers/text-config.js"></script>
    <script src="../helpers/util.js"></script>
    <script src="../helpers/ribbons-config.js"></script>
    <script src="../helpers/bmi-facts-config.js"></script>

    <!-- Calculator Scripts -->
    <script src="../unit-converter/unit-converter.js"></script>

    <!-- Main Script (load last) -->
    <script src="../helpers/script.js"></script>

    <!-- Initialize Unit Converter -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (
          window.UnitConverter &&
          window.UnitConverter.initializeUnitConverter
        ) {
          window.UnitConverter.initializeUnitConverter();
        } else {
          console.error(
            "Unit Converter not found or initializeUnitConverter not available"
          );
        }
      });
    </script>
  </body>
</html>
