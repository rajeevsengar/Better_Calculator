<!DOCTYPE html>
<html data-theme="default">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unit Converter</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon.png" />
    
    <!-- Scripts -->
    <script src="../helpers/script.js"></script>
    <script src="../helpers/script-loader.js"></script>
    <script>
      // Initialize page with centralized CSS and script loading
      document.addEventListener('DOMContentLoaded', function() {
        // Apply data-theme first to prevent flash
        setTimeout(() => {
          if (document.body) {
            document.body.setAttribute('data-theme-applied', 'true');
          }
        }, 50);
        
        // Load CSS first
        window.loadCSSForPage('calculator', 'unitConverter');
        
        // Then load scripts and initialize
        window.loadScriptsForPage('calculator', 'unitConverter').then(() => {
          // Initialize calculator after all scripts are loaded
          if (
            window.UnitConverter &&
            window.UnitConverter.initializeUnitConverter
          ) {
            window.UnitConverter.initializeUnitConverter();
          } else {
            console.error(
              "Unit Converter not found or initializeUnitConverter not available"
            );
          }
        }).catch(error => {
          console.error('Failed to load scripts:', error);
        });
      });
      
      // Hide spinner after all resources are loaded
      window.addEventListener('load', function() {
        const loader = document.querySelector('#initial-loader');
        const app = document.querySelector('#app');
        if (loader && app) {
          loader.style.display = 'none';
          app.style.display = 'block';
        }
      });
    </script>
  </head>
  <body>
    <div id="initial-loader">
      <div class="spinner"></div>
    </div>
    <div id="app" style="display:none;">
      <div class="page-container">
        <site-header></site-header>
        <menu-header></menu-header>

        <main>
          <!-- Main Content Wrapper -->
          <div class="main-content-wrapper">
            <!-- Left Grid: Calculator Content -->
            <div class="left-grid">
              <!-- Unit Converter -->
              <div class="calculator-content">
                <div class="calculator-main-section" style="display: flex; ">
                    <!-- Unit Types section - Left side -->
                    <div class="unit-types-section">
                        <div class="title-header">Unit Types</div>
                        <!-- Mobile-friendly combobox -->
                        <select id="mobileUnitTypes" class="mobile-unit-select">
                            <option value="">Select Unit Type</option>
                        </select>
                        <!-- Desktop list view -->
                        <div id="unitTypesList" class="unit-types-list desktop-unit-types-list">
                            <!-- Content will be populated dynamically from text-config.js -->
                        </div>
                    </div>
                    
                    <!-- From-To inputs and swap button - Right side -->
                    <div  style="display: flex; flex-direction: column;flex: 1; gap: 1rem;">
                        <div class="from-to-section" style="display: flex;">
                            <div class="card" style="flex: 1;">
                                <div class="title-header">From</div>
                                <input id="fromValue" placeholder="Enter value" />
                                <div class="unit-chips-container">
                                    <div id="fromUnitButtons" class="unit-buttons"></div>
                                </div>
                            </div>
                            <div class="card" style="flex: 1;">
                                <div class="title-header">To</div>
                                <input id="toValue" placeholder="Result" readonly />
                                <div class="unit-chips-container">
                                    <div id="toUnitButtons" class="unit-buttons"></div>
                                </div>
                            </div>
                        </div>
                          <!-- Swap button below the inputs -->
                        <div class="swap-button-center" style="display: flex; justify-content: center;">
                            <button onclick="swapUnits()" class="button-primary">
                                Swap
                            </button>
                        </div>
                    </div>
                </div>
              </div>
            </div>
            
            <!-- Right Grid: Ad Space -->
            <div class="right-grid">
              <div class="ad-space">
                Ad Space<br><br><br><br><br><br>Ad Space<br><br><br><br><br><br>Ad Space
              </div>
            </div>
          </div>
          
          <!-- Additional Content Wrapper (for calculator description, etc.) -->
          <div class="main-content-wrapper">
            <!-- Left Grid: Calculator Description -->
            <div class="left-grid">
              <calculator-description calculator="conversion"></calculator-description>
            </div>
            
            <!-- Right Grid: Additional Ad Space or Content -->
            <div class="right-grid">
              <div class="ad-space">
                Additional Ad Space<br><br><br><br><br><br>Ad Space<br><br><br><br><br><br>Ad Space
              </div>
            </div>
          </div>
        </main>
        
        <!-- Site Footer Component -->
        <site-footer></site-footer>
      </div>
    </div>
  </body>
</html>
