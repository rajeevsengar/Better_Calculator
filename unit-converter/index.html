<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unit Converter</title>
    
    <!-- Critical theme initialization to prevent flash -->
    <script>
      // Immediately set theme to prevent flash
      (function() {
        const savedTheme = localStorage.getItem('selectedTheme') || 'default';
        document.documentElement.setAttribute('data-theme', savedTheme);
      })();
      
      // Wait for DOM and CSS to be ready before showing content
      document.addEventListener('DOMContentLoaded', function() {
        // Small delay to ensure CSS variables are loaded
        setTimeout(() => {
          if (document.body) {
            document.body.setAttribute('data-theme-applied', 'true');
          }
        }, 50);
      });
      
      // Hide spinner after all resources are loaded
      window.addEventListener('load', function() {
        const loader = document.querySelector('#initial-loader');
        const app = document.querySelector('#app');
        if (loader && app) {
          loader.style.display = 'none';
          app.style.display = 'block';
        }
      });
    </script>
    
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/misc.css" />
    <link rel="stylesheet" href="../components/themes-selector/themes.css" />
    <link rel="stylesheet" href="unit-converter.css" />

    <!-- Scripts -->
    <script src="../components/themes-selector/themes-selector.js"></script>
    <script src="../helpers/script.js" defer></script>
    <script src="../helpers/constants.js" defer></script>
    <script src="../helpers/text-config.js" defer></script>
    <script src="../helpers/util.js" defer></script>
    <script src="../helpers/ribbons-config.js" defer></script>
    <script src="../components/site-header/site-header.js"></script>
    <script src="unit-converter.js" defer></script>
  </head>
  <body>
    <div id="initial-loader">
      <div class="spinner"></div>
    </div>
    <div id="app" style="display:none;">
      <div class="page-container">
        <site-header></site-header>
  
        <main class="calculator-main-container">
          <!-- Unit Converter -->
          <div class="calculator-content">
            <div class="calculator-main-section" style="display: flex; ">
                <!-- Unit Types section - Left side -->
                <div class="unit-types-section">
                    <div class="title-header">Unit Types</div>
                    <!-- Mobile-friendly combobox -->
                    <select id="mobileUnitTypes" class="mobile-unit-select">
                        <option value="">Select Unit Type</option>
                    </select>
                    <!-- Desktop list view -->
                    <div id="unitTypesList" class="unit-types-list desktop-unit-types-list">
                        <!-- Content will be populated dynamically from text-config.js -->
                    </div>
                </div>
                
                <!-- From-To inputs and swap button - Right side -->
                <div  style="display: flex; flex-direction: column;flex: 1; gap: 1rem;">
                    <div class="from-to-section" style="display: flex;">
                        <div class="card" style="flex: 1;">
                            <div class="title-header">From</div>
                            <input id="fromValue" placeholder="Enter value" />
                            <div class="unit-chips-container">
                                <div id="fromUnitButtons" class="unit-buttons"></div>
                            </div>
                        </div>
                        <div class="card" style="flex: 1;">
                            <div class="title-header">To</div>
                            <input id="toValue" placeholder="Result" readonly />
                            <div class="unit-chips-container">
                                <div id="toUnitButtons" class="unit-buttons"></div>
                            </div>
                        </div>
                    </div>
                      <!-- Swap button below the inputs -->
                    <div class="swap-button-center" style="display: flex; justify-content: center;">
                        <button onclick="swapUnits()" class="button-primary">
                            Swap
                        </button>
                    </div>
                </div>
            </div>
          </div>
          <div class="ad-space">
            Ad Space<br><br><br><br><br><br>Ad Space<br><br><br><br><br><br>Ad Space
          </div>
        </main>
      </div>
    </div>
    <!-- Initialize Unit Converter -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (
          window.UnitConverter &&
          window.UnitConverter.initializeUnitConverter
        ) {
          window.UnitConverter.initializeUnitConverter();
        } else {
          console.error(
            "Unit Converter not found or initializeUnitConverter not available"
          );
        }
      });
    </script>
  </body>
</html>
