<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="sitemap-title"></title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon.png" />
    
    <!-- Scripts -->
    <script src="../../helpers/script.js"></script>
    <script src="../../helpers/script-loader.js"></script>
    <script>
      // Initialize page with centralized CSS and script loading
      document.addEventListener('DOMContentLoaded', function() {
        // Apply data-theme first to prevent flash
        setTimeout(() => {
          if (document.body) {
            document.body.setAttribute('data-theme-applied', 'true');
          }
        }, 50);
        
        // Load CSS first
        window.loadCSSForPage('info', 'sitemap');
        
        // Then load scripts and initialize
        window.loadScriptsForPage('info').then(() => {
          // Initialize sitemap after all scripts are loaded
          const brandInfo = window.getBrandInfo();
          
          // Set page title
          const pageTitle = document.getElementById('sitemap-title');
          if (pageTitle) {
            pageTitle.textContent = `Sitemap - ${brandInfo.name}`;
          }
          
          const urls = window.getURLS();
          
          // Populate main pages
          const mainPagesList = document.getElementById('main-pages-list');
          if (mainPagesList) {
            mainPagesList.innerHTML = `
              <li><a href="${urls.home}">Home</a></li>
              <li><a href="${urls.aboutUs}">About Us</a></li>
            `;
          }
          
          // Populate calculators using centralized mapping
          const calculatorsList = document.getElementById('calculators-list');
          if (calculatorsList) {
            const categories = window.initializeCalculatorCategories();
            
            calculatorsList.innerHTML = categories.map(category => {
              const availableCalculators = category.calculators.filter(calc => calc.available);
              if (availableCalculators.length === 0) return '';
              
              return `
                <div class="sitemap-category">
                  <h3 class="sitemap-category-title">${category.name}</h3>
                  <div class="sitemap-category-calculators">
                    ${availableCalculators.map(calc => `
                      <div onclick="window.location.href='${calc.url || '#'}'" class="sitemap-calculator-item">
                        <li><a>${calc.text}</a></li>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('');
          }
          
          // Populate quick links
          const quickLinksList = document.getElementById('quick-links-list');
          if (quickLinksList) {
            quickLinksList.innerHTML = `
              <li><a href="${urls.githubUrl}" target="_blank">GitHub Repository</a></li>
              <li><a href="${urls.aboutUs}">About ${brandInfo.name}</a></li>
              <li><a href="${urls.home}">Back to Home</a></li>
            `;
          }
        }).catch(error => {
          console.error('Failed to load scripts:', error);
        });
      });
      
      // Hide spinner after all resources are loaded
      window.addEventListener('load', function() {
        const loader = document.querySelector('#initial-loader');
        const app = document.querySelector('#app');
        if (loader && app) {
          loader.style.display = 'none';
          app.style.display = 'block';
        }
      });
    </script>
  </head>

  <body>
    <div id="initial-loader">
      <div class="spinner"></div>
    </div>

    <div id="app" style="display:none;">
      <div class="page-container">
        <!-- Site Header Component -->
        <site-header></site-header>
        <menu-header></menu-header>

        <main>
          <div class="main-content-wrapper">
            <!-- Left Grid: Sitemap Content -->
            <div class="left-grid">
              <div class="sitemap-content">
                <h1 class="sitemap-title">Sitemap</h1>
                
                <div class="sitemap-section">
                  <h2>Main Pages</h2>
                  <ul class="sitemap-list" id="main-pages-list">
                    <!-- Links will be populated by JavaScript -->
                  </ul>
                </div>
                
                <div class="sitemap-section">
                  <h2>Calculators</h2>
                  <ul class="sitemap-list" id="calculators-list">
                    <!-- Links will be populated by JavaScript -->
                  </ul>
                </div>
              </div>
            </div>
            
            <!-- Right Grid: Additional Content -->
            <div class="right-grid">
              <div class="sitemap-sidebar">
                <h3>Quick Links</h3>
                <ul class="quick-links" id="quick-links-list">
                  <!-- Links will be populated by JavaScript -->
                </ul>
              </div>
            </div>
          </div>
        </main>

        <!-- Site Footer Component -->
        <site-footer></site-footer>
      </div>
    </div>

  </body>
</html>
