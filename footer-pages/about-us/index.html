<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="about-title"></title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon.png" />
    
    <!-- Scripts -->
    <script src="../../helpers/script.js"></script>
    <script src="../../helpers/script-loader.js"></script>
    <script>
      // Initialize page with centralized CSS and script loading
      document.addEventListener('DOMContentLoaded', function() {
        // Apply data-theme first to prevent flash
        setTimeout(() => {
          if (document.body) {
            document.body.setAttribute('data-theme-applied', 'true');
          }
        }, 50);
        
        // Load CSS first
        window.loadCSSForPage('info');
        
        // Then load scripts and initialize
        window.loadScriptsForPage('info').then(() => {
          // Initialize about-us page after all scripts are loaded
          const brandInfo = window.getBrandInfo();
          
          // Set page title
          const pageTitle = document.getElementById('about-title');
          if (pageTitle) {
            pageTitle.textContent = `About Us - ${brandInfo.name}`;
          }
          
          // Set info page title
          const infoPage = document.querySelector('info-page');
          if (infoPage) {
            infoPage.setAttribute('page-title', `About ${brandInfo.name}`);
          }
          
          // Initialize sidebar links using centralized mapping
          const sidebar = document.getElementById('about-sidebar');
          if (sidebar) {
            const availableCalculators = window.getAvailableCalculators();
            const urls = window.getURLS();
            const links = availableCalculators.map(calc => ({
              "text": calc.text,
              "href": urls[calc.urlKey] || '#'
            }));
            sidebar.setAttribute('sidebar-links', JSON.stringify(links));
          }
        }).catch(error => {
          console.error('Failed to load scripts:', error);
        });
      });
      
      // Hide spinner after all resources are loaded
      window.addEventListener('load', function() {
        const loader = document.querySelector('#initial-loader');
        const app = document.querySelector('#app');
        if (loader && app) {
          loader.style.display = 'none';
          app.style.display = 'block';
        }
      });
    </script>
  </head>

  <body>
    <div id="initial-loader">
      <div class="spinner"></div>
    </div>

    <div id="app" style="display:none;">
      <div class="page-container">
        <!-- Site Header Component -->
        <site-header></site-header>
        <menu-header></menu-header>

        <main>
          <div class="main-content-wrapper">
            <!-- Left Grid: About Content -->
            <div class="left-grid">
              <info-page 
                page-title="" 
                content-key="aboutUs.content">
              </info-page>
            </div>
            
            <!-- Right Grid: Additional Content -->
            <div class="right-grid">
              <info-sidebar 
                id="about-sidebar"
                sidebar-title="Our Calculators"
                sidebar-links='[]'>
              </info-sidebar>
            </div>
          </div>
        </main>

        <!-- Site Footer Component -->
        <site-footer></site-footer>
      </div>
    </div>

    
  </body>
</html>
